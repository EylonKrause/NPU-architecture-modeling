name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'  # weekly, to catch runner-image and toolchain drift

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BUILD_TOOLS: cmake==3.31.10 ninja==1.11.1.4

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.8 ruff==0.16.10
      - name: clang-format
        run: git ls-files -z '*.cpp' '*.hpp' | xargs -0 clang-format --dry-run --Werror
      - name: ruff check
        if: success() || failure()
        run: ruff check --output-format=github .
      - name: ruff format
        if: success() || failure()
        run: ruff format --check .

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x64-gcc, os: ubuntu-24.04, preset: ci-gcc, cc: gcc, cxx: g++}
          - {name: linux-x64-clang, os: ubuntu-24.04, preset: ci-clang, cc: clang, cxx: clang++}
          - {name: linux-arm64-gcc, os: ubuntu-24.04-arm, preset: ci-gcc, cc: gcc, cxx: g++}
          - {name: macos-arm64-clang, os: macos-15, preset: ci-clang, cc: clang, cxx: clang++}
          - {name: windows-x64-msvc, os: windows-2025, preset: ci-msvc, cc: cl, cxx: cl}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install $BUILD_TOOLS
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - id: systemc
        uses: ./.github/actions/systemc
        with:
          toolchain: ${{ matrix.name }}
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }} -DNPU_FETCH_SYSTEMC=OFF
          -DCMAKE_PREFIX_PATH="${{ steps.systemc.outputs.prefix }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: >-
          ctest --preset ${{ matrix.preset }}
          --output-junit "${GITHUB_WORKSPACE}/junit-${{ matrix.name }}.xml"
      - name: Upload test report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.name }}
          path: junit-${{ matrix.name }}.xml
          if-no-files-found: ignore
      # The one-command path from the README: a fresh FetchContent build, then reuse of it.
      - name: Launcher builds from scratch and reuses the build
        if: runner.os != 'Linux'
        run: |
          python run.py --build-only --jobs 4
          python run.py --build-only --jobs 4
      - name: Waveforms and result files
        if: matrix.name == 'linux-x64-gcc'
        run: |
          bin=build/${{ matrix.preset }}
          mkdir -p results
          $bin/npu-sim --m 8 --n 8 --k 16 --vcd results/pipeline.vcd \
            --progress-jsonl results/progress.jsonl > results/pipeline.json
          $bin/npu-tlm-demo --jobs 2 --vcd results/tlm > results/tlm.json
          $bin/npu-transformer-demo --precision fp16 --prefill 4 --decode 3 \
            --vcd results/transformer.vcd --progress-jsonl results/transformer.jsonl \
            > results/transformer.json
          $bin/npu-mobile-demo --cores 2 --jobs 6 --vcd results/mobile \
            > results/mobile-platform.json
          cp -R $bin/examples-mobile results/mobile-suite
      - name: Upload waveforms and result files
        if: matrix.name == 'linux-x64-gcc'
        uses: actions/upload-artifact@v4
        with:
          name: systemc-waveforms-and-results
          path: results/

  sanitizers:
    name: linux-x64-asan-ubsan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install $BUILD_TOOLS
      # SystemC is fetched and built with the same instrumentation as the project.
      - run: cmake --workflow --preset asan-ubsan

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install $BUILD_TOOLS gcovr==8.4
      - id: systemc
        uses: ./.github/actions/systemc
        with:
          toolchain: linux-x64-gcc
      - name: Configure
        run: >-
          cmake --preset coverage -DNPU_FETCH_SYSTEMC=OFF
          -DCMAKE_PREFIX_PATH="${{ steps.systemc.outputs.prefix }}"
      - run: cmake --build --preset coverage
      - run: ctest --preset coverage
      - name: Line coverage of src/ and include/
        run: |
          mkdir -p coverage
          gcovr --root . --object-directory build/coverage --filter 'src/' --filter 'include/' \
            --print-summary --txt coverage/summary.txt \
            --xml coverage/coverage.xml --html-details coverage/index.html
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  onnx:
    name: onnx-runtime-differential
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onnx.txt
      - run: python -m pip install $BUILD_TOOLS -r requirements-onnx.txt
      - id: systemc
        uses: ./.github/actions/systemc
        with:
          toolchain: linux-x64-gcc
      - name: Configure
        run: >-
          cmake --preset ci-gcc -DNPU_FETCH_SYSTEMC=OFF
          -DCMAKE_PREFIX_PATH="${{ steps.systemc.outputs.prefix }}"
          -DNPU_ENABLE_ONNX_TESTS=ON -DPython3_EXECUTABLE="$(command -v python)"
      - run: cmake --build --preset ci-gcc
      - run: ctest --preset ci-gcc -L onnx
