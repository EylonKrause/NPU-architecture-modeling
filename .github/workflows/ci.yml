name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compilers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: Architecture sweep
        run: python3 scripts/sweep.py --binary build/npu-sim
      - name: Timing-mode agreement
        run: python3 scripts/compare_modes.py --binary build/npu-sim --repeats 2
      - name: Two-layer inference
        run: python3 scripts/mlp_demo.py --binary build/npu-sim
      - name: CNN and residual graph inference
        run: |
          python3 scripts/graph_runtime.py examples/cnn.json --binary build/npu-sim
          python3 scripts/graph_runtime.py examples/residual_mlp.json --binary build/npu-sim
      - name: Mobile compression, stateful transformer and multicore workloads
        run: |
          python3 scripts/mobile_suite.py --build-dir build --output-dir results/mobile
          python3 scripts/graph_optimize.py examples/mobile_fusion.json --verify --binary build/npu-sim --output results/mobile/fused-graph.json
      - name: SRAM-constrained mapping search
        run: python3 scripts/autotune.py --binary build/npu-sim
      - name: Native SystemC waveform and TLM examples
        if: matrix.cc == 'gcc'
        run: |
          mkdir -p results
          build/npu-sim --m 8 --n 8 --k 16 --vcd results/pipeline.vcd --progress-jsonl results/progress.jsonl > results/pipeline.json
          build/npu-tlm-demo --jobs 2 --vcd results/tlm > results/tlm.json
          build/npu-transformer-demo --precision fp16 --prefill 4 --decode 3 --vcd results/transformer.vcd --progress-jsonl results/transformer.jsonl > results/transformer.json
          build/npu-mobile-demo --cores 2 --jobs 6 --vcd results/mobile > results/mobile-platform.json
      - uses: actions/upload-artifact@v4
        if: matrix.cc == 'gcc'
        with:
          name: systemc-waveforms-and-results
          path: results/

  undefined-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core sanitizer build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNPU_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  onnx-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-onnx.txt
      - name: Install optional model-format dependencies
        run: python -m pip install -r requirements-onnx.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNPU_ENABLE_ONNX_TESTS=ON -DPython3_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build build -j2
      - name: Tests and ONNX Runtime comparison
        run: ctest --test-dir build --output-on-failure

  native-launcher:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build through the Python launcher
        run: python run.py --build-only --jobs 2
      - name: Reuse the existing native build
        run: python run.py --build-only --jobs 2
      - name: Exercise native launcher lifecycle
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python tests/launcher_tests.py --binary build-live/Release/npu-sim.exe
          else
            python tests/launcher_tests.py --binary build-live/npu-sim
          fi
