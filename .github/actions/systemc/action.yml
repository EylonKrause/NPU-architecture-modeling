name: SystemC prefix
description: >-
  Restore the pinned SystemC install prefix for this runner image and compiler from the cache,
  or build it with cmake/BuildSystemC.cmake and cache it. Run after the compiler environment
  is set up (CC/CXX, or the MSVC developer environment).
inputs:
  toolchain:
    description: Name of the compiler configuration, part of the cache key (e.g. linux-x64-gcc).
    required: true
outputs:
  prefix:
    description: Install prefix to pass as CMAKE_PREFIX_PATH with -DNPU_FETCH_SYSTEMC=OFF.
    value: ${{ steps.paths.outputs.prefix }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        # pwd -W gives C:/... on Windows runners, so CMake never sees backslashes.
        root="$(pwd -W 2>/dev/null || pwd)"
        echo "prefix=${root}/.deps/systemc" >> "$GITHUB_OUTPUT"
        # The image version changes whenever the preinstalled compilers do.
        echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    # Restore and save are separate steps: actions/cache saves in a post step that runs only
    # when the whole job succeeds, so a leg with failing tests would rebuild SystemC every run.
    - id: cache
      uses: actions/cache/restore@v4
      with:
        path: .deps/systemc
        # cmake/*SystemC*.cmake: the pin, the build script and the MSVC patch.
        key: systemc-${{ inputs.toolchain }}-${{ steps.paths.outputs.image }}-${{ hashFiles('cmake/*SystemC*.cmake') }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: >-
        cmake -DNPU_SYSTEMC_PREFIX="${{ steps.paths.outputs.prefix }}"
        -DNPU_SYSTEMC_WORK="${RUNNER_TEMP}/systemc-build"
        -P cmake/BuildSystemC.cmake
    - if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .deps/systemc
        key: ${{ steps.cache.outputs.cache-primary-key }}
